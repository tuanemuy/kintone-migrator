name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test
        # Mirrors a developer shell with a `.env` loaded, so tests that
        # inherit the CLI's variables from the host fail in CI too.
        env:
          KINTONE_DOMAIN: host.cybozu.com
          KINTONE_API_TOKEN: host-token
          KINTONE_USERNAME: host-user
          KINTONE_PASSWORD: host-pass
          KINTONE_APP_ID: "999"
          KINTONE_GUEST_SPACE_ID: "998"
          SCHEMA_FILE_PATH: host-schema.yaml
          VERBOSE: "1"
